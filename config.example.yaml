host: "127.0.0.1"
port: 8020
work_dir: "./work"

comfyui:
  base_url: "http://127.0.0.1:8188"
  timeout_seconds: 1800
  poll_interval_seconds: 2.0

renderer:
  fps: 24
  min_seconds: 5.0
  max_seconds: 15.0
  max_total_seconds: 120.0
  max_shots: 12

ollama:
  # H3 and a 27B LLM do not fit on the same 32GB GPU. The service asks Ollama
  # to unload this model immediately before it hands the card to ComfyUI. Set
  # this to false once nothing local competes with ComfyUI for the card.
  unload_before_render: true
  base_url: "http://127.0.0.1:11434"
  model: "qwen3.6:27b"

director:
  # Rewrites plain language into H3's three-field prompt format — the job the
  # hosted API does with its closed-source Context-IR module. Runs only behind
  # POST /v1/enhance, never inside a render, so a render stays reproducible from
  # its recorded spec and an outage here can never block the GPU.
  enabled: true
  guide_file: "./prompts/h3_prompt_guide.md"
  # Reject a rewrite that changes the user's dialogue. H3 speaks whatever is
  # inside <d> verbatim, so a paraphrase there is a wrong take.
  require_verbatim_dialogue: true
  # One retry, feeding the failed checks back as corrections.
  max_attempts: 2
  # Used when POST /v1/enhance does not name one.
  default: "claude"
  # Every key here becomes a choice in the control plane's picker; GET /health
  # lists them. Add the same provider twice under different keys to A/B two
  # models. api_key_env is only needed to override the SDK's own variable
  # (ANTHROPIC_API_KEY, OPENAI_API_KEY); base_url only to reach a gateway.
  providers:
    claude:
      provider: "anthropic"     # needs: pip install -e ".[anthropic]"
      model: "claude-opus-5"
    chatgpt:
      provider: "openai"        # needs: pip install -e ".[openai]"
      model: "gpt-5.1"          # set this to the model you actually have
    local:
      provider: "ollama"        # no key, no extra dependency
      model: "qwen3.6:27b"
      base_url: "http://127.0.0.1:11434"

modes:
  t2v:
    workflow_file: "./workflows/minimax_h3_t2v.json"
    inputs:
      prompt: ["105:104.prompt"]
      width: ["105:104.width"]
      height: ["105:104.height"]
      length: ["105:104.length"]
      seed: ["105:15.noise_seed"]
  i2v:
    workflow_file: "./workflows/minimax_h3_i2v.json"
    inputs:
      prompt: ["105:104.prompt"]
      width: ["105:104.width"]
      height: ["105:104.height"]
      length: ["105:104.length"]
      seed: ["105:15.noise_seed"]
      first_frame: ["114.image"]
  flf2v:
    workflow_file: "./workflows/minimax_h3_flf2v.json"
    inputs:
      prompt: ["105:104.prompt"]
      width: ["105:104.width"]
      height: ["105:104.height"]
      length: ["105:104.length"]
      seed: ["105:15.noise_seed"]
      first_frame: ["114.image"]
      last_frame: ["200.image"]
  story:
    # Requires ComfyUI_MiniMaxH3_Director in ComfyUI/custom_nodes.
    workflow_file: "./workflows/minimax_h3_director_story.json"
    inputs:
      prompt: ["5.global_prompt"]
      width: ["5.width"]
      height: ["5.height"]
      length: ["5.total_frames"]
      seed: ["5.seed"]
      timeline: ["5.timeline_data"]
