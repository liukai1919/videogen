host: "127.0.0.1"
port: 8020
work_dir: "./work"

comfyui:
  base_url: "http://127.0.0.1:8188"
  timeout_seconds: 1800
  poll_interval_seconds: 2.0

renderer:
  fps: 24
  min_seconds: 5.0
  max_seconds: 15.0
  max_total_seconds: 120.0
  max_shots: 12

ollama:
  # H3 and a 27B LLM do not fit on the same 32GB GPU. The service asks Ollama
  # to unload this model immediately before it hands the card to ComfyUI.
  unload_before_render: true
  base_url: "http://127.0.0.1:11434"
  model: "qwen3.6:27b"

script:
  # YouTube 网址 → yt-dlp 取字幕 → Ollama 总结 → 分镜脚本(POST /v1/scripts)。
  enabled: true
  # 留空则复用 ollama.model。
  model: null
  temperature: 0.4
  timeout_seconds: 600
  fetch_timeout_seconds: 60
  # 按顺序挑字幕语言,人工字幕优先于自动字幕。
  subtitle_languages: ["zh-Hans", "zh-Hant", "zh", "en"]
  max_transcript_chars: 24000
  max_source_seconds: 14400
  target_seconds: 60
  shot_seconds: 6
  max_shots: 8
  style: "写实科普纪录片质感,柔和自然光,镜头稳定,画面里不要出现文字、字幕或水印"
  # 需要登录态或代理才能取到字幕时再填。
  cookies_file: null
  proxy: null

modes:
  t2v:
    workflow_file: "./workflows/minimax_h3_t2v.json"
    inputs:
      prompt: ["105:104.prompt"]
      width: ["105:104.width"]
      height: ["105:104.height"]
      length: ["105:104.length"]
      seed: ["105:15.noise_seed"]
  i2v:
    workflow_file: "./workflows/minimax_h3_i2v.json"
    inputs:
      prompt: ["105:104.prompt"]
      width: ["105:104.width"]
      height: ["105:104.height"]
      length: ["105:104.length"]
      seed: ["105:15.noise_seed"]
      first_frame: ["114.image"]
  flf2v:
    workflow_file: "./workflows/minimax_h3_flf2v.json"
    inputs:
      prompt: ["105:104.prompt"]
      width: ["105:104.width"]
      height: ["105:104.height"]
      length: ["105:104.length"]
      seed: ["105:15.noise_seed"]
      first_frame: ["114.image"]
      last_frame: ["200.image"]
  story:
    # Requires ComfyUI_MiniMaxH3_Director in ComfyUI/custom_nodes.
    workflow_file: "./workflows/minimax_h3_director_story.json"
    inputs:
      prompt: ["5.global_prompt"]
      width: ["5.width"]
      height: ["5.height"]
      length: ["5.total_frames"]
      seed: ["5.seed"]
      timeline: ["5.timeline_data"]
