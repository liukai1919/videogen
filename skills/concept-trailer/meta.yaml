name: 概念预告片
description: 电影级概念预告片质感:强对比戏剧光、快节奏、跨段角色一致、画面无文字。
category: 预告片
version: "1.1"
use_when:
  - 概念预告片、片花、trailer、先导预告
  - 电影感、大片感的短促悬念叙事
  - 虚构世界观、架空设定的开场钩子
not_for:
  - 讲清原理和知识点的科普、纪录片内容(用 science-doc)
  - 写实教学、测评、解说类视频
defaults:
  style: 电影级概念预告片质感,强对比戏剧光,体积光,色调统一,快速有力的镜头运动,画面里不要出现文字、字幕或水印
  shot_seconds: 5
  target_seconds: 15
